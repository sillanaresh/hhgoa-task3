[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "faceproof"
version = "0.1.0"
description = "Find public face matches and publish tamper-evident proof to Base Sepolia."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [{ name = "Naresh Silla" }]
dependencies = [
  "eth-account>=0.13.7,<0.14",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "numpy>=2.1,<3",
  "opencv-contrib-python-headless>=4.11,<5",
  "pillow>=11.3,<13",
  "pydantic-settings>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "rich>=14,<15",
  "typer>=0.16,<1",
  "uvicorn[standard]>=0.35,<1",
  "web3>=7.13,<8",
]

[project.optional-dependencies]
dev = [
  "bandit>=1.8,<2",
  "mypy>=1.17,<2",
  "pip-audit>=2.9,<3",
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "respx>=0.22,<1",
  "ruff>=0.12,<1",
]

[project.scripts]
faceproof = "faceproof.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/faceproof"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "SIM", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["faceproof"]

[tool.coverage.run]
omit = ["src/faceproof/__main__.py", "src/faceproof/cli.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
